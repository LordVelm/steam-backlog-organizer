[package]
name = "gamekeeper"
version = "4.0.0"
edition = "2021"

[lib]
name = "gamekeeper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "gamekeeper"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
dirs = "5"
rand = "0.9"
futures-util = "0.3"
zip = "2"
tauri-plugin-shell = "2"
# Taste engine
model2vec-rs = "0.2"
rayon = "1"
flate2 = "1"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_SystemInformation", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
